  <rect class="s" x="2.5" y="8.5" width="27" height="21.5" rx="2"/>
  <circle class="s" cx="16" cy="13.6" r="3"/>
  <line class="s" x1="16" y1="16.6" x2="16" y2="19.5"/>
  <rect class="s" x="8" y="19.5" width="16" height="7.5" rx="1.5"/>
