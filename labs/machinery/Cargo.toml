[package]
name = "hp"
version = "0.1.0"
description = "The Hyperprior Institute's lab machinery: sparks, sketches, lifecycle and the site."
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
latex2mathml = "0.2"
maud = "0.27"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
quick-xml = "0.38"
tempfile = "3"
